<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>Paris Dash</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Silkscreen&display=swap">
<style>
/* Layout: one-screen arcade cabinet — 16:9 stage on top, touch pad below on phones */
:root{
  --night:#141022; --dusk:#2a2147; --zinc:#3b3658; --lamp:#ffcf6e; --tricolor-red:#e2475a; --cream:#f3e9d8;
  --display:"Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
  --ui:"Silkscreen", "Courier New", monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--cream);font-family:var(--display);margin:0;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;box-sizing:border-box;
  touch-action:none;user-select:none;-webkit-user-select:none}
.stage{position:relative;width:min(100%, calc((100vh - 170px) * 16 / 9), 1280px);aspect-ratio:16/9;max-width:100%;
  border-radius:6px;overflow:hidden;box-shadow:0 0 0 3px var(--zinc),0 18px 50px rgba(0,0,0,.55)}
canvas{display:block;width:100%;height:100%;image-rendering:auto;background:var(--dusk)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2cqh;
  background:rgba(20,16,34,.72);text-align:center;padding:16px;container-type:size}
.stage{container-type:inline-size}
.overlay[hidden]{display:none}
.overlay h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,8cqw,84px);margin:0;letter-spacing:.02em;line-height:1;
  color:var(--cream);text-shadow:0 4px 0 var(--tricolor-red),0 8px 0 #1e3a8a;text-wrap:balance}
.overlay p{margin:0;font-family:var(--ui);font-size:clamp(10px,1.7cqw,16px);opacity:.9;line-height:1.6;max-width:44ch}
.overlay img{height:clamp(60px,22cqw,190px);width:auto}
.btn{font-family:var(--ui);font-size:clamp(12px,2cqw,18px);background:var(--lamp);color:var(--night);border:0;border-radius:4px;
  padding:.7em 1.6em;cursor:pointer;box-shadow:0 4px 0 #b9852c}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b9852c}
.btn:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
.keys{font-family:var(--ui);font-size:clamp(9px,1.4cqw,13px);opacity:.75}
.pad{display:none;width:min(100%,1280px);justify-content:space-between;align-items:center;gap:12px}
.pad .grp{display:flex;gap:12px}
.pad button{width:72px;height:72px;border-radius:50%;border:0;background:var(--zinc);color:var(--cream);
  font-family:var(--ui);font-size:13px;box-shadow:0 5px 0 #1d1a33;touch-action:none}
.pad button.on{transform:translateY(4px);box-shadow:0 1px 0 #1d1a33;background:#4d4775}
.pad .a{background:var(--tricolor-red)} .pad .b{background:#2f5bd3}
.pad .a.on{background:#c13246} .pad .b.on{background:#2448aa}
@media (pointer:coarse){ .pad{display:flex} .keys{display:none} }
@media (pointer:coarse) and (orientation:landscape){
  body{flex-direction:row;gap:10px} .pad{display:contents} .pad .grp{flex-direction:column}
  .stage{width:min(calc(100% - 190px),calc((100vh - 24px)*16/9))}
  .pad button{width:64px;height:64px}
  .grp.left{order:-1}
}
</style>

<div class="stage" id="stage">
  <canvas id="c" width="1280" height="720" aria-label="Paris Dash game"></canvas>
  <div class="overlay" id="ov">
    <img id="ovImg" alt="">
    <h1 id="ovTitle">Paris Dash</h1>
    <p id="ovText">Run across Paris to the café at the end of the street. Kick or stomp the barking dogs, grab croissants, and don't fall in the Seine.</p>
    <button class="btn" id="ovBtn">Play</button>
    <div class="keys" id="ovKeys">← → move · Space / ↑ jump · X kick</div>
  </div>
</div>
<div class="pad" id="pad">
  <div class="grp left"><button data-k="left" aria-label="Left">◀</button><button data-k="right" aria-label="Right">▶</button></div>
  <div class="grp"><button class="b" data-k="kick" aria-label="Kick">KICK</button><button class="a" data-k="jump" aria-label="Jump">JUMP</button></div>
</div>

let AC=null;

function blip(f1,f2,dur,type='square',vol=.08){ if(!AC)return; const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
  o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur);}

let P,dogs,crois,parts,popups,cam,state='title',lives,score,ccount,checkpoint,endT,t=0;
function reset(full){
  if(full){lives=3;score=0;ccount=0;checkpoint=60;
    crois=croissantSpots.map(([x,y])=>({x,y,got:0}));
    dogs=dogDefs.map(([x,a,b,y])=>({x,y:y-40,w:46,h:40,a,b,dir:-1,st:'walk',st_t:0,ft:0,barkCd:0,alive:1,fade:1}));}

// ---------- physics ----------
const GRAV=1900, SPEED=200, ACC=1500, FRIC=1700, JUMP=640;
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function movePlayer(dt){
  const dirIn=(keys.right?1:0)-(keys.left?1:0);
  if(dirIn){P.vx+=dirIn*ACC*dt; P.vx=Math.max(-SPEED,Math.min(SPEED,P.vx)); P.face=dirIn;}
  else{const s=Math.sign(P.vx); P.vx-=s*FRIC*dt; if(Math.sign(P.vx)!==s)P.vx=0;}
  if(P.kick>0&&P.ground)P.vx*=0.9;
  P.coyote=P.ground?0.1:P.coyote-dt;
  if(jumpPressed>0&&P.coyote>0){P.vy=-JUMP;P.coyote=0;jumpPressed=0;P.ground=0;sfx.jump();dust(P.x+P.w/2,P.y+P.h,6);}
  if(!keys.jump&&P.vy<-220)P.vy=-220;
  if(kickPressed>0&&P.kick<=0){P.kick=0.32;P.kickHit=0;kickPressed=0;sfx.kick();}
  P.vy=Math.min(P.vy+GRAV*dt,900);
  // X
  P.x+=P.vx*dt; P.x=Math.max(0,Math.min(LEVEL_W-P.w,P.x));
  for(const s of solids){ if(s.oneway)continue; if(overlap(P,s)){ if(P.vx>0)P.x=s.x-P.w; else if(P.vx<0)P.x=s.x+s.w; P.vx=0; } }
  // Y
  const prevBottom=P.y+P.h; P.y+=P.vy*dt; const was=P.ground; P.ground=0;
  for(const s of solids){ if(!overlap(P,s))continue;
    if(s.oneway){ if(P.vy>=0&&prevBottom<=s.y+1){P.y=s.y-P.h;P.vy=0;P.ground=1;} continue; }
    if(P.vy>0){P.y=s.y-P.h;P.vy=0;P.ground=1;} else if(P.vy<0){P.y=s.y+s.h;P.vy=0;} }
  if(P.ground&&!was){P.land=0.12;dust(P.x+P.w/2,P.y+P.h,5);}
}
function dust(x,y,n){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*120,vy:-Math.random()*60,l:.4,c:'#e9e1d3',r:2+Math.random()*2});}
function popup(x,y,txt,c='#ffcf6e'){popups.push({x,y,txt,l:.9,c});}

function hurt(fromX){
  if(P.inv>0)return; lives--; sfx.hurt(); P.inv=1.6; P.vy=-380; P.vx=(P.x<fromX?-1:1)*240;
  if(lives<=0)lose();
}
function lose(){state='lose';endT=0;setTimeout(()=>showOverlay('lose'),1300);}
function win(){state='win';endT=0;sfx.win();setTimeout(()=>showOverlay('win'),1400);}

function update(dt){
  t+=dt; jumpPressed-=dt; kickPressed-=dt;
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.l-=dt;} parts=parts.filter(p=>p.l>0);
  for(const p of popups){p.y-=30*dt;p.l-=dt;} popups=popups.filter(p=>p.l>0);
  if(state!=='play'){ if(state==='win'||state==='lose')endT+=dt; return; }
  movePlayer(dt);
  P.inv-=dt; P.land-=dt; P.anim+=dt;
  if(P.kick>0)P.kick-=dt;
  // fell in the Seine
  if(P.y>H+20){ sfx.splash(); for(let i=0;i<14;i++)parts.push({x:P.x+12,y:340,vx:(Math.random()-.5)*160,vy:-Math.random()*220,l:.7,c:'#9fc3ff',r:2+Math.random()*2});
    lives--; if(lives<=0){P.y=H+200;lose();} else {reset(false);} return; }
  if(P.x>CHECK&&checkpoint<CHECK){checkpoint=CHECK+10;popup(CHECK,200,'CHECKPOINT','#9fe0ff');sfx.coin();}
  // croissants
  for(const c of crois){ if(!c.got&&Math.abs(P.x+12-c.x)<18&&Math.abs(P.y+30-c.y)<34){c.got=1;ccount++;score+=10;sfx.coin();popup(c.x,c.y-10,'+10');} }
  // kick hitbox
  const kb=(P.kick>0.06&&P.kick<0.26)?{x:P.face>0?P.x+P.w-2:P.x-34,y:P.y+22,w:36,h:30}:null;
  for(const d of dogs){ if(!d.alive)continue;
    d.ft+=dt; d.st_t+=dt; d.barkCd-=dt;
    const dx=(P.x+P.w/2)-(d.x+d.w/2), near=Math.abs(dx)<150&&Math.abs((P.y+P.h)-(d.y+d.h))<50;
    if(d.st==='walk'){ d.x+=d.dir*55*dt; if(d.x<d.a){d.x=d.a;d.dir=1;} if(d.x+d.w>d.b){d.x=d.b-d.w;d.dir=-1;}
      if(near&&d.barkCd<=0){d.st='bark';d.st_t=0;d.ft=0;d.dir=Math.sign(dx)||d.dir;sfx.bark();} }
    else if(d.st==='bark'){ if(d.st_t>0.6){d.st='lunge';d.st_t=0;} }
    else if(d.st==='lunge'){ d.x+=d.dir*170*dt; d.x=Math.max(d.a,Math.min(d.b-d.w,d.x)); if(d.st_t>0.5){d.st='walk';d.barkCd=1.6;} }
    else if(d.st==='hit'){ d.x+=d.kx*dt; d.kx*=0.9; if(d.st_t>0.4){d.st='dead';d.st_t=0;d.ft=0;} continue; }
    else if(d.st==='dead'){ if(d.st_t>1.4){d.fade-=dt*2; if(d.fade<=0)d.alive=0;} continue; }
    const body={x:d.x+6,y:d.y+6,w:d.w-12,h:d.h-6};
    if(kb&&overlap(kb,body)){ knock(d,P.face); continue; }
    if(overlap(P,body)){
      if(P.vy>60&&P.y+P.h-d.y<20){ knock(d,0); P.vy=-430; score+=50; }
      else hurt(d.x+d.w/2);
    }
  }
  if(P.x+P.w>GOAL+10&&P.ground){win();}
  cam+=((P.x-W*0.38)-cam)*Math.min(1,dt*6); cam=Math.max(0,Math.min(LEVEL_W-W,cam));
}
function knock(d,dir){ d.st='hit';d.st_t=0;d.ft=0;d.kx=dir*260;score+=100;sfx.kick();popup(d.x+d.w/2,d.y-6,dir?'POW! +100':'STOMP! +150','#ff8a8a');
  for(let i=0;i<8;i++)parts.push({x:d.x+d.w/2,y:d.y+16,vx:(Math.random()-.5)*200,vy:-Math.random()*200,l:.5,c:'#ffd166',r:2});}

// ---------- background art ----------
const sky=(()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#1b1740');gr.addColorStop(.45,'#4b3a7a');gr.addColorStop(.75,'#c7698a');gr.addColorStop(1,'#f3a76b');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  for(let i=0;i<70;i++){g.fillStyle=`rgba(255,255,255,${Math.random()*.7})`;g.fillRect(Math.random()*W,Math.random()*140,1,1);}
  g.fillStyle='#fde9c6';g.beginPath();g.arc(520,62,16,0,7);g.fill();g.fillStyle='#4b3a7a';g.beginPath();g.arc(512,57,15,0,7);g.fill();
  return c;})();
function rng(s){return()=>(s=(s*16807)%2147483647)/2147483647;}
function buildStrip(seed,tint,winC,hMin,hMax,roof){const c=document.createElement('canvas');c.width=1600;c.height=260;const g=c.getContext('2d');const r=rng(seed);
  let x=0;while(x<1600){const w=Math.min(1600-x,110+r()*90|0),h=hMin+r()*(hMax-hMin)|0,top=260-h;
    g.fillStyle=tint;g.fillRect(x,top,w,h);
    g.fillStyle=roof;g.beginPath();g.moveTo(x-2,top);g.lineTo(x+8,top-26);g.lineTo(x+w-8,top-26);g.lineTo(x+w+2,top);g.fill();
    for(let cx=x+14;cx<x+w-10;cx+=34+r()*30){g.fillRect(cx,top-38,8,14);}
    for(let dx=x+16;dx<x+w-16;dx+=26){g.fillStyle=r()<.55?winC:'rgba(0,0,0,.25)';g.fillRect(dx,top-20,8,10);}
    const floors=Math.floor((h-30)/26);
    for(let f=0;f<floors;f++){const y=top+10+f*26;
      for(let dx=x+12;dx<x+w-14;dx+=24){g.fillStyle=r()<.42?winC:'rgba(10,8,30,.45)';g.fillRect(dx,y,10,16);}
      if(f===1||f===floors-2){g.fillStyle='rgba(10,8,25,.75)';g.fillRect(x+6,y+16,w-12,2);for(let bx=x+8;bx<x+w-8;bx+=4)g.fillRect(bx,y+11,1,5);}
    }
    g.fillStyle='rgba(0,0,0,.18)';g.fillRect(x+w-3,top,3,h);
    x+=w+2;}
  return c;}
const farStrip=buildStrip(7,'#5c4f86','rgba(255,214,140,.55)',90,140,'#3a3263');
const midStrip=buildStrip(42,'#8d7a9c','#ffcf6e',140,200,'#3f3a5c');
function drawEiffel(x){ // base center x, base at y=G-40
  const by=G-30, top=22; ctx.save(); ctx.fillStyle='#1c1636'; ctx.strokeStyle='#1c1636';
  ctx.beginPath(); ctx.moveTo(x-90,by); ctx.quadraticCurveTo(x-34,by-100,x-14,top+90); ctx.lineTo(x-5,top+10); ctx.lineTo(x+5,top+10); ctx.lineTo(x+14,top+90);
  ctx.quadraticCurveTo(x+34,by-100,x+90,by); ctx.lineTo(x+58,by); ctx.quadraticCurveTo(x,by-90,x-58,by); ctx.closePath(); ctx.fill();
  ctx.fillRect(x-50,by-66,100,7); ctx.fillRect(x-22,top+92,44,5); ctx.fillRect(x-8,top+10,16,4); ctx.fillRect(x-1,top-10,2,22);
  // lattice
  ctx.strokeStyle='rgba(255,207,110,.35)'; ctx.lineWidth=.6;
  for(let i=0;i<14;i++){const y=by-62-i*14; if(y<top+12)break; const s=Math.max(4,(y-top)*0.11); ctx.beginPath();ctx.moveTo(x-s,y);ctx.lineTo(x+s,y-12);ctx.moveTo(x+s,y);ctx.lineTo(x-s,y-12);ctx.stroke();}
  // sparkle lights on the hour
  for(let i=0;i<22;i++){const ph=(i*0.37+t*3)%1; if(ph<.5){const y=top+15+((i*53)%170), s=Math.max(3,(y-top)*0.12); ctx.fillStyle='#fff6d6'; ctx.fillRect(x+((i*31)%(2*s))-s,y,1.4,1.4);} }
  ctx.fillStyle='rgba(255,230,160,'+(.5+.5*Math.sin(t*4))+')'; ctx.beginPath(); ctx.arc(x,top-10,2,0,7); ctx.fill();
  ctx.restore();}
const cobble=(()=>{const c=document.createElement('canvas');c.width=48;c.height=24;const g=c.getContext('2d');
  g.fillStyle='#3d3550';g.fillRect(0,0,48,24);g.fillStyle='#5a5070';
  for(let r=0;r<2;r++)for(let i=0;i<4;i++){const ox=(r%2)*6;g.fillRect(i*12+ox+1,r*12+1,10,10);}
  g.fillStyle='#6b6183';for(let r=0;r<2;r++)for(let i=0;i<4;i++){const ox=(r%2)*6;g.fillRect(i*12+ox+1,r*12+1,10,2);}
  return ctx.createPattern(c,'repeat');})();

function drawLamp(x){ctx.fillStyle='#16132a';ctx.fillRect(x-2,G-84,4,84);ctx.fillRect(x-6,G-6,12,6);ctx.fillRect(x-8,G-90,16,4);
  const gl=ctx.createRadialGradient(x,G-80,1,x,G-80,40);gl.addColorStop(0,'rgba(255,207,110,.55)');gl.addColorStop(1,'rgba(255,207,110,0)');
  ctx.fillStyle=gl;ctx.fillRect(x-40,G-120,80,80);ctx.fillStyle='#ffcf6e';ctx.fillRect(x-4,G-86,8,8);}
function drawCroissant(x,y){const b=Math.sin(t*4+x)*2; ctx.save();ctx.translate(x,y+b);
  ctx.fillStyle='#8a4b18';ctx.beginPath();ctx.ellipse(0,0,10,6,0,Math.PI,0);ctx.fill();
  ctx.fillStyle='#e0953f';ctx.beginPath();ctx.ellipse(0,-1,9,5,0,Math.PI,0);ctx.fill();
  ctx.fillStyle='#f5c26b';for(let i=-1;i<=1;i++){ctx.fillRect(i*5-1,-6,2,5);} ctx.fillStyle='#e0953f';
  ctx.beginPath();ctx.ellipse(-10,1,3,3,0,0,7);ctx.ellipse(10,1,3,3,0,0,7);ctx.fill();ctx.restore();}
function drawGoal(x){ // café façade + tricolore
  ctx.fillStyle='#2a2340';ctx.fillRect(x,G-130,110,130);
  ctx.fillStyle='#7d2235';ctx.fillRect(x-6,G-130,122,16);
  for(let i=0;i<6;i++){ctx.fillStyle=i%2?'#f3e9d8':'#c8324a';ctx.beginPath();ctx.moveTo(x-6+i*20.3,G-114);ctx.lineTo(x+14+i*20.3,G-114);ctx.lineTo(x+4+i*20.3,G-100);ctx.fill();}
  ctx.fillStyle='#ffcf6e';ctx.fillRect(x+12,G-92,30,40);ctx.fillRect(x+66,G-92,30,40);
  ctx.fillStyle='#1a1530';ctx.fillRect(x+46,G-70,18,70);
  ctx.fillStyle='#f3e9d8';ctx.font='700 13px "Pixelify Sans",sans-serif';ctx.textAlign='center';ctx.fillText('CAFÉ',x+55,G-118);
  ctx.fillStyle='#16132a';ctx.fillRect(x+130,G-150,3,150);
  const wv=Math.sin(t*5)*2;[['#2f5bd3',0],['#f3e9d8',12],['#e2475a',24]].forEach(([c,o])=>{ctx.fillStyle=c;ctx.fillRect(x+133+o,G-150+(o?wv*o/24:0),12,24);});
  ctx.fillStyle='#16132a';ctx.fillRect(x+140,G-12,40,12);}
function drawCheckpoint(x){const on=checkpoint>=CHECK;ctx.fillStyle='#16132a';ctx.fillRect(x,G-70,3,70);
  ctx.fillStyle=on?'#9fe0ff':'#6b6183';ctx.beginPath();ctx.moveTo(x+3,G-70);ctx.lineTo(x+26,G-62);ctx.lineTo(x+3,G-54);ctx.fill();}
function drawKiosk(s){ctx.fillStyle='#24543f';ctx.fillRect(s.x,s.y+6,s.w,s.h-6);ctx.fillStyle='#2f6e53';ctx.fillRect(s.x-4,s.y,s.w+8,8);
  ctx.fillStyle='#e9dcc0';ctx.fillRect(s.x+6,s.y+14,s.w-12,14);ctx.fillStyle='#24543f';ctx.font='7px Silkscreen,monospace';ctx.textAlign='center';ctx.fillText('JOURNAUX',s.x+s.w/2,s.y+24);
  ctx.fillStyle='#1b3f2f';ctx.fillRect(s.x+4,s.y+32,s.w-8,s.h-34);}
function drawPlat(s){ctx.fillStyle='#d9ccb3';ctx.fillRect(s.x,s.y,s.w,6);ctx.fillStyle='#a8977c';ctx.fillRect(s.x,s.y+6,s.w,4);
  ctx.fillStyle='#16132a';ctx.fillRect(s.x,s.y-12,s.w,2);for(let i=s.x+2;i<s.x+s.w;i+=6){ctx.fillRect(i,s.y-12,1.5,12);}
  ctx.fillStyle='rgba(22,19,42,.5)';ctx.fillRect(s.x+4,s.y+10,4,6);ctx.fillRect(s.x+s.w-8,s.y+10,4,6);}

// ---------- sprites ----------
function spr(img,fr,cx,by,flip,scale=.5,rot=0,alpha=1){const[sx,sy,sw,sh]=fr;const w=sw*scale,h=sh*scale;
  ctx.save();ctx.globalAlpha=alpha;ctx.translate(cx,by);if(flip)ctx.scale(-1,1);if(rot)ctx.rotate(rot);ctx.drawImage(img,sx,sy,sw,sh,-w/2,-h,w,h);ctx.restore();}
function drawHero(){
  if(P.inv>0&&state==='play'&&Math.floor(t*14)%2)return;
  const cx=P.x+P.w/2, by=P.y+P.h+3, fl=P.face<0;
  if(state==='win'){spr(heroImg,HM.victory[0],cx,by,0);return;}
  if(state==='lose'&&P.y<H){spr(heroImg,HM.defeat[0],cx,by,fl);return;}
  if(P.kick>0){spr(heroImg,HM.run[2],cx,by,fl,.5,-0.22);
    if(P.kick>0.06&&P.kick<0.26){ctx.save();ctx.translate(cx+(fl?-1:1)*22,P.y+40);ctx.scale(fl?-1:1,1);ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(0,0,18,-1.1,1.1);ctx.stroke();ctx.fillStyle='#ffd166';ctx.font='700 10px "Pixelify Sans",sans-serif';ctx.fillText('POW',14,-16);ctx.restore();}
    return;}
  if(!P.ground){spr(heroImg,HM.jump[1],cx,by,fl);return;}
  if(P.land>0){spr(heroImg,HM.jump[2],cx,by,fl);return;}
  const sp=Math.abs(P.vx);
  if(sp<10){spr(heroImg,HM.idle[Math.floor(t*4)%4],cx,by,fl);return;}
  if(sp<150){spr(heroImg,HM.walk[Math.floor(t*9)%4],cx,by,fl);return;}
  spr(heroImg,HM.run[Math.floor(t*12)%4],cx,by,fl);
}
function drawDog(d){if(!d.alive)return;const cx=d.x+d.w/2,by=d.y+d.h+3,fl=d.dir<0;let fr;
  if(d.st==='walk'||d.st==='lunge')fr=DM.walk[Math.floor(d.ft*(d.st==='lunge'?14:7))%4];
  else if(d.st==='bark')fr=DM.bark[Math.min(3,Math.floor(d.st_t/0.15))];
  else if(d.st==='hit')fr=DM.hit[Math.min(3,Math.floor(d.st_t/0.1))];
  else fr=DM.defeat[Math.min(3,Math.floor(d.st_t/0.12))];
  spr(dogImg,fr,cx,by,fl,.5,0,Math.max(0,d.fade));}

// ---------- render ----------
function render(){
  ctx.drawImage(sky,0,0);
  drawEiffel(470-cam*0.1);
  ctx.drawImage(farStrip,-(cam*0.25)%1600,G-240,1600,260*.92); ctx.drawImage(farStrip,1600-(cam*0.25)%1600,G-240,1600,260*.92);
  ctx.fillStyle='rgba(199,105,138,.18)';ctx.fillRect(0,0,W,H);
  ctx.drawImage(midStrip,-(cam*0.5)%1600,G-250);ctx.drawImage(midStrip,1600-(cam*0.5)%1600,G-250);
  // Seine
  const rv=ctx.createLinearGradient(0,G,0,H);rv.addColorStop(0,'#2a3f7a');rv.addColorStop(1,'#141c3d');ctx.fillStyle=rv;ctx.fillRect(0,G+18,W,H);
  ctx.fillStyle='rgba(255,207,110,.4)';for(let i=0;i<30;i++){const x=((i*97-cam*1+t*20)%700+700)%700-30;ctx.fillRect(x,G+30+(i*13)%30,10+(i%3)*6,1);}
  ctx.save();ctx.translate(-Math.round(cam),0);
  for(let x=140;x<LEVEL_W;x+=320){if(grounds.some(([a,b])=>x>a+10&&x<b-10))drawLamp(x);}
  drawCheckpoint(CHECK); drawGoal(GOAL);
  for(const s of solids){
    if(s.t==='g'){ctx.fillStyle=cobble;ctx.save();ctx.translate(0,G);ctx.fillRect(s.x,8,s.w,s.h);ctx.restore();
      ctx.fillStyle='#d9ccb3';ctx.fillRect(s.x,G,s.w,8);ctx.fillStyle='#a8977c';ctx.fillRect(s.x,G+8,s.w,3);
      ctx.fillStyle='#8a7b62';ctx.fillRect(s.x,G,3,120);ctx.fillRect(s.x+s.w-3,G,3,120);}
    else if(s.t==='k')drawKiosk(s); else drawPlat(s);}
  for(const c of crois)if(!c.got)drawCroissant(c.x,c.y);
  for(const d of dogs)drawDog(d);
  drawHero();
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.l*2);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.r,p.r);} ctx.globalAlpha=1;
  ctx.textAlign='center';ctx.font='700 11px "Pixelify Sans",sans-serif';
  for(const p of popups){ctx.globalAlpha=Math.min(1,p.l*2);ctx.fillStyle='#16132a';ctx.fillText(p.txt,p.x+1,p.y+1);ctx.fillStyle=p.c;ctx.fillText(p.txt,p.x,p.y);} ctx.globalAlpha=1;
  ctx.restore();
  // HUD
  ctx.fillStyle='rgba(20,16,34,.6)';ctx.fillRect(8,8,232,24);
  for(let i=0;i<3;i++){const x=20+i*18,y=20;ctx.fillStyle=i<lives?'#e2475a':'#3b3658';ctx.beginPath();ctx.arc(x-3,y-2,4,0,7);ctx.arc(x+3,y-2,4,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(x-7,y);ctx.lineTo(x+7,y);ctx.lineTo(x,y+7);ctx.fill();}
  drawCroissant(88,24);ctx.fillStyle='#f3e9d8';ctx.font='10px Silkscreen,monospace';ctx.textAlign='left';ctx.fillText('×'+ccount,102,25);
  ctx.fillText('SCORE '+String(score).padStart(5,'0'),140,25);
  // progress
  ctx.fillStyle='rgba(20,16,34,.6)';ctx.fillRect(W-128,12,116,8);ctx.fillStyle='#ffcf6e';ctx.fillRect(W-126,14,112*Math.min(1,P.x/GOAL),4);
}

// ---------- overlay / loop ----------
const ovEl=document.getElementById('ov'),ovTitle=document.getElementById('ovTitle'),ovText=document.getElementById('ovText'),ovBtn=document.getElementById('ovBtn'),ovImg=document.getElementById('ovImg');
function showOverlay(kind){
  if(kind==='win'){ovTitle.textContent='Bravo !';score+=lives*200;ovText.textContent=`You reached the café with ${ccount} of ${crois.length} croissants. Final score: ${score}, including ${lives*200} for hearts left.`;ovBtn.textContent='Play again';cropTo(HM.victory[0]);}
  else{ovTitle.textContent='Game over';ovText.textContent=`The dogs of Paris won this time. Score: ${score}.`;ovBtn.textContent='Try again';cropTo(HM.defeat[0]);}
  ovEl.hidden=false; ovBtn.focus();
}
function cropTo(fr){const c=document.createElement('canvas');c.width=fr[2];c.height=fr[3];c.getContext('2d').drawImage(heroImg,fr[0],fr[1],fr[2],fr[3],0,0,fr[2],fr[3]);ovImg.src=c.toDataURL();}
function start(){audio();reset(true);state='play';ovEl.hidden=true;cv.focus?.();}
ovBtn.addEventListener('click',start);
let last=performance.now();
function loop(now){const dt=Math.min(0.033,(now-last)/1000);last=now;update(dt);if(heroImg.complete&&dogImg.complete)render();requestAnimationFrame(loop);}
heroImg.onload=()=>cropTo(HM.idle[0]);
requestAnimationFrame(loop);
</script>
